<html>
<head>
    <!-- Gauges from https://github.com/sebmatton/jQuery-Flight-Indicators -->
    <!-- Flight Indicators library styles -->
    <link rel="stylesheet" type="text/css" href="css/flightindicators.css" />

<script src="js/jquery-3.2.1.min.js"></script>
<!-- Importing the FlightIndicators library -->
<script src="js/jquery.flightindicators.js"></script>

</head>
<body>
<button onclick='SPAD_Disconnect()'>Disconnect</button>
<button onclick='SPAD_Update()'>Request Update</button>

 <div class="examples">
        <div>
            <span id="airspeed"></span>
            <span id="attitude"></span>
            <span id="altimeter"></span>            
        </div><div>
            <span id="turn_coordinator"></span>
            <span id="heading"></span>
            <span id="variometer"></span>
        </div>
    </div>

<script>

/* All the stuff for the gauges */

// DataBag 
var gaugeData = { 
	"A:AIRSPEED SELECT INDICATED OR TRUE,KNOTS":0,
	"A:ATTITUDE INDICATOR BANK DEGREES,DEGREES":0,
	"A:ATTITUDE INDICATOR PITCH DEGREES,DEGREES":0,
	"A:INDICATED ALTITUDE,FEET":0,
	"A:KOHLSMAN SETTING MB":0,
	"A:DELTA HEADING RATE,RPM":0,
	"A:AUTOPILOT HEADING LOCK DIR,DEGREES":0,
	"A:VERTICAL SPEED,FEET PER MINUTE":0,
 };

// Helper vars for the gauges
var attitude = $.flightIndicator('#attitude', 'attitude', {roll:50, pitch:-20, size:200, showBox : true});
var heading = $.flightIndicator('#heading', 'heading', {heading:150, showBox:true});
var variometer = $.flightIndicator('#variometer', 'variometer', {vario:-5, showBox:true});
var airspeed = $.flightIndicator('#airspeed', 'airspeed', {showBox: false});
var altimeter = $.flightIndicator('#altimeter', 'altimeter');
var turn_coordinator = $.flightIndicator('#turn_coordinator', 'turn_coordinator', {turn:0});

// The actual magic. Update the gauges
function updategauges()
{
	airspeed.setAirSpeed(gaugeData["A:AIRSPEED SELECT INDICATED OR TRUE,KNOTS"]);
	
	attitude.setRoll(gaugeData["A:ATTITUDE INDICATOR BANK DEGREES,DEGREES"]);
	attitude.setPitch(gaugeData["A:ATTITUDE INDICATOR PITCH DEGREES,DEGREES"]);
	
	altimeter.setAltitude(gaugeData["A:INDICATED ALTITUDE,FEET"]);
	altimeter.setPressure(gaugeData["A:KOHLSMAN SETTING MB"]);

	turn_coordinator.setTurn(gaugeData["A:DELTA HEADING RATE,RPM"]);

	heading.setHeading(gaugeData["A:AUTOPILOT HEADING LOCK DIR,DEGREES"]);

	variometer.setVario(gaugeData["A:VERTICAL SPEED,FEET PER MINUTE"]);
}


/* SPAD connection stuff: data subscription over WebSocket */
var remoteHost = "127.0.0.1:28001";

// The apiKey is only needed when this page runs on another computer than SPAD.neXt.
// Leave it empty there to get the key with the challenge dialog, or enter your SPAD.neXt api key here.
var apiKey = "NONEED";

var socket = null;
var nextCommandId = 1;
var gaugeTimer = null;

var onError = function (e) {
	console.log(e);
};

// Send one command to SPAD. Every command is answered with a "reply" message carrying the same id.
function SPAD_Send(command)
{
	command.id = nextCommandId++;
	socket.send(JSON.stringify(command));
}

// Request SPAD to resend all subscribed data
function SPAD_Update()
{
	SPAD_Send({ cmd: "requestupdate" });
}

// Reading and writing single values stays a normal web request
function SPAD_SetData(varname,varvalue)
{
	$.post("http://"+remoteHost+"/data/set?apikey="+apiKey, { name:varname, value:varvalue }, function () { }).fail(onError);
}

function SPAD_GetData(varname)
{
	$.post("http://"+remoteHost+"/data/get?apikey="+apiKey, { name:varname}, function (data) { console.log("received",data); }).fail(onError);
}

function SPAD_SubscribeData()
{
	// subscribe to the data we need
	SPAD_Send({ cmd: "subscribe", dataRefs: Object.keys(gaugeData) });

	// Disable batch update mode (default: 500ms) and request to get every change immediately
	SPAD_Send({ cmd: "config", interval: 0 });

	// last but not least, let the magic begin. update the gauges all 50ms
	if (gaugeTimer == null)
		gaugeTimer = setInterval(updategauges, 50);
}

// unsubscribe from all data (the connection stays open)
function SPAD_Disconnect()
{
	SPAD_Send({ cmd: "unsubscribe", dataRefs: [] });
}

// Connect to the SPAD data WebSocket
function SPAD_Connect()
{
	socket = new WebSocket("ws://"+remoteHost+"/data?apikey="+encodeURIComponent(apiKey));

	socket.onmessage = function (event) {
		var msg = JSON.parse(event.data);
		switch (msg.type) {
			case "connected":	// first message after the connection is open
				console.log("connected to SPAD.neXt", msg.version);
				SPAD_SubscribeData();
				break;
			case "update":		// a databag with data update pairs has been received
				for (var i in msg.data) {
					gaugeData[i] = msg.data[i];
					console.log(i , "=>" , msg.data[i]);
				}
				break;
			case "reply":		// answer to a command
				if (!msg.success)
					console.log("command failed", msg);
				else if (msg.cmd == "subscribe" && msg.failed.length > 0)
					console.log("not subscribed", msg.failed);
				break;
		}
	};

	// Subscriptions end with the connection. Connect again and subscribe again.
	socket.onclose = function () {
		console.log("connection closed, trying again in 3 seconds");
		setTimeout(SPAD_Connect, 3000);
	};
}


if (apiKey == "") // Only needed when connecting from remote
{
	console.log("Challenging SPAD");
	$.post("http://"+remoteHost+"/challenge",{ }, function () { }).fail(onError);
	let challResponse = prompt("Enter Challenge Key","");
	console.log("You entered",challResponse)
	$.post("http://"+remoteHost+"/challenge/accept?format=json",{ Token:challResponse }, function (data) { 
	    if (data.Success)
		{
			apiKey = data.Result.ApiKey;
			SPAD_Connect(); 
		}
		else
		{
			alert("Challenge failed!");
		}
	}).fail(onError);
}
else // known key or local connection, just start right away
{
	SPAD_Connect();
}
</script>
</body>
</html>
